name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle & wrapper cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ensure SDK platform 36 (no-op если уже есть)
        run: |
          yes | sdkmanager "platforms;android-36" > /dev/null 2>&1 || echo "platform android-36 already present"
          yes | sdkmanager "build-tools;36.0.0" > /dev/null 2>&1 || echo "build-tools 36 already present"

      - name: Lint (ktlint + detekt, baseline: только новые нарушения валят)
        run: |
          chmod +x gradlew
          ./gradlew :app:ktlintCheck --no-daemon --console=plain
          ./gradlew :app:detekt --no-daemon --console=plain

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error