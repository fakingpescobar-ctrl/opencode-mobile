name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle & wrapper cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: "gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ensure SDK platform 36 (no-op если уже есть)
        run: |
          yes | sdkmanager "platforms;android-36" > /dev/null 2>&1 || echo "platform android-36 already present"
          yes | sdkmanager "build-tools;36.0.0" > /dev/null 2>&1 || echo "build-tools 36 already present"

      - name: "Build (Kotlin compile) + линт"
        run: |
          chmod +x gradlew
          ./gradlew :app:ktlintCheck :app:detekt --no-daemon --console=plain
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain

      # Реальная сборка APK (CI-15): раньше CI ограничивался compileDebugKotlin и
      # НЕ проверял packaging (ресурсы, jniLibs, манифест). whisperlib-нативка на
      # ubuntu не собирается в принципе — ей нужны ВНЕШНИЕ whisper.cpp (вне репо)
      # и VulkanSDK (Windows): сборка модуля выключается флагом -PskipNativeBuild,
      # APK пакует prebuilt libopencode.so/libbun-musl.so из jniLibs (CI-16).
      - name: "Assemble debug APK (без whisper-нативки — см. skipNativeBuild)"
        run: |
          ./gradlew :app:assembleDebug -PskipNativeBuild=true --no-daemon --console=plain

      # Нативные артефакты НЕ генерируются на CI (внешние зависимости): проверяем,
      # что prebuilt в репо на месте и ncnn-исходники (in-repo) присутствуют.
      # Полная native-сборка — локально на машине разработчика (build_ncnn.bat /
      # build-release.ps1) с whisper.cpp + VulkanSDK (CI-16).
      - name: "Нативная проверка (prebuilt jniLibs + ncnn in-repo)"
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libopencode.so
          test -s app/src/main/jniLibs/arm64-v8a/libbun-musl.so
          test -d third_party/ncnn/src
          echo "native artifacts: OK (prebuilt opencode/bun .so + ncnn sources in-repo; whisper.cpp/VulkanSDK — external, собираются локально)"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/ktlint
            app/build/reports/detekt
          if-no-files-found: ignore

  # Windows native job (CI-17): реальная сборка whisper-нативки против
  # закреплённого пина whisper.cpp + ncnn (in-repo), БЕЗ VulkanSDK:
  # -PggmlVulkan=OFF (прод-путь STT — CPU/int8, Vulkan эксперимент выключен;
  # локально ggmlVulkan по умолчанию ON — поведение разработчика не меняется).
  # Проверяет, что НАСТОЯЩАЯ сборка (CMake/NDK, без skipNativeBuild) проходит на
  # чистой машине, а не только на машине разработчика.
  native-windows:
    name: Native build (windows, whisper.cpp + ncnn, CPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # whisper.cpp — внешняя зависимость: клонируем ровно тот пин, что
      # закреплён в whisperlib/src/main/jni/whisper/WHISPER_PIN (gradle
      # сам сделает fail-fast при несовпадении HEAD).
      - name: Checkout pinned whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggerganov/whisper.cpp
          ref: c4ac0012a8f5a2082dfca6aad4ddfd8b2c02b337
          path: whisper.cpp
          fetch-depth: 1

      - name: JDK 17 (AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK platform / build-tools / NDK / CMake
        shell: pwsh
        run: |
          $sdk = "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat"
          & $sdk "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Assemble debug APK с нативкой (CPU, без VulkanSDK)"
        shell: pwsh
        run: |
          .\gradlew.bat :app:assembleDebug `
            "-PwhisperCppDir=${{ github.workspace }}\whisper.cpp" `
            "-PggmlVulkan=OFF" --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload APK (native)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-native-windows
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore