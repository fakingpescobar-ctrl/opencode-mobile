name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle & wrapper cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: "gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ensure SDK platform 36 (no-op если уже есть)
        run: |
          yes | sdkmanager "platforms;android-36" > /dev/null 2>&1 || echo "platform android-36 already present"
          yes | sdkmanager "build-tools;36.0.0" > /dev/null 2>&1 || echo "build-tools 36 already present"

      - name: "Build (Kotlin compile) + линт"
        run: |
          chmod +x gradlew
          ./gradlew :app:ktlintCheck :app:detekt --no-daemon --console=plain
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/ktlint
            app/build/reports/detekt
          if-no-files-found: ignore