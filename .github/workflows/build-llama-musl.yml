# CI: собрать llama.cpp + обёртку под musl aarch64 и выложить .so артефактом.
# НЕ трогает release-apk.yml и живой APK. Класть в .github/workflows/build-llama-musl.yml.
# На телефоне грузится через наш libldmusl.so + bun:ffi (bionic-.so так не грузится).
# Источники тулчейна: apt zig → ziglang.org (GitHub release-ассетов у Zig нет).
name: Build llama.cpp musl bench (arm64)

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'тег llama.cpp'
        required: false
        default: 'b12554'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репо (за wrapper.c)
        uses: actions/checkout@v4

      - name: Zig toolchain (aarch64-linux-musl через zig cc)
        run: |
          if command -v zig >/dev/null 2>&1; then
            echo "zig уже есть: $(zig version)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq zig || true
          fi
          if ! command -v zig >/dev/null 2>&1; then
            ZIG=0.13.0
            curl -fsSL --max-time 120 -o /tmp/zig.tar.xz \
              "https://ziglang.org/download/${ZIG}/zig-linux-x86_64-${ZIG}.tar.xz"
            tar -xf /tmp/zig.tar.xz -C /tmp
            echo "/tmp/zig-linux-x86_64-${ZIG}" >> $GITHUB_PATH
          fi
          zig version
          printf '#!/bin/sh\nexec zig cc -target aarch64-linux-musl "$@"\n' > /tmp/aarch64-musl-cc
          printf '#!/bin/sh\nexec zig c++ -target aarch64-linux-musl "$@"\n' > /tmp/aarch64-musl-cxx
          chmod +x /tmp/aarch64-musl-cc /tmp/aarch64-musl-cxx

      - name: llama.cpp source
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.llama_ref || 'b4680' }} \
            https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cp "$GITHUB_WORKSPACE/MOBILE_AGENT/tools/llama-bench/llama-bench-wrapper.c" /tmp/llama.cpp/

      - name: CMake static libs (CPU only)
        run: |
          cd /tmp/llama.cpp
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/tmp/aarch64-musl-cc \
            -DCMAKE_CXX_COMPILER=/tmp/aarch64-musl-cxx \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON
          cmake --build build -j4 --target llama

      - name: Wrap in shared .so (Musl)
        run: |
          cd /tmp/llama.cpp
          /tmp/aarch64-musl-cxx -O3 -fPIC -Iinclude -Iggml/include \
            -c llama-bench-wrapper.c -o wrapper.o
          STATIC_LIBS=$(find build -name '*.a' | tr '\n' ' ')
          echo "static libs: $STATIC_LIBS"
          test -n "$STATIC_LIBS" || { echo "нет статических архивов"; exit 1; }
          /tmp/aarch64-musl-cxx -shared -o libllama-bench.so wrapper.o \
            -Wl,--whole-archive $STATIC_LIBS -Wl,--no-whole-archive \
            -static-libstdc++ -static-libgcc -lm -lpthread
          file libllama-bench.so
          readelf -Ws libllama-bench.so | grep -E 'lb_bench|lb_version'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-bench-musl-arm64
          path: /tmp/llama.cpp/libllama-bench.so
