# Research-only G8: собрать qwentts.cpp под musl aarch64 и проверить асинхронный
# CodecDecode (перекрытие с AR) в pipeline-tts.cpp. Не трогает release-apk.yml,
# APK, подпись и установку на устройство.
# План: docs/plans/qwen3-tts-g8-codec-overlap.md (зафиксирован до правок, commit 085e369).
# База: G4 codec8 (qwen-tts 595035cd...). Единственная переменная — G8 overlap.
# Запрещено: GGML_CPU_ARM_ARCH / повтор G1d; KleidiAI (G2 DROP); SVE2/SME2.
name: Build qwentts ARM research (baseline/overlap)

on:
  workflow_dispatch:
    inputs:
      qwen_ref:
        description: 'Коммит/тег ServeurpersoCom/qwentts.cpp'
        required: false
        default: '2edb35f87b709a070b2d5379f77e5c52a1daa585'
      variant:
        description: 'baseline (G4 codec8) или overlap (одна переменная: pipeline-tts.cpp)'
        required: false
        default: 'baseline'
        type: choice
        options:
          - baseline
          - overlap

permissions:
  contents: read

concurrency:
  group: qwentts-arm-overlap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Проверить вариант и зафиксировать параметры
        id: params
        run: |
          set -euo pipefail
          VARIANT="${{ github.event.inputs.variant || 'baseline' }}"
          case "$VARIANT" in
            baseline|overlap) ;;
            *) echo "Неизвестный variant: $VARIANT" >&2; exit 1 ;;
          esac
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "research variant: $VARIANT"
          echo "GGML_CPU_KLEIDIAI: OFF (G2 DROP, не повторяем)"
          echo "GGML_CPU_ARM_ARCH: не задаётся (G1d DROP, не повторяем)"

      - name: Zig toolchain (aarch64-linux-musl через zig cc)
        run: |
          set -euo pipefail
          if ! command -v zig >/dev/null 2>&1 || ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zig gcc-aarch64-linux-gnu || true
          fi
          if ! command -v zig >/dev/null 2>&1; then
            ZIG=0.13.0
            curl -fsSL --max-time 120 -o /tmp/zig.tar.xz \
              "https://ziglang.org/download/${ZIG}/zig-linux-x86_64-${ZIG}.tar.xz"
            tar -xf /tmp/zig.tar.xz -C /tmp
            echo "/tmp/zig-linux-x86_64-${ZIG}" >> $GITHUB_PATH
          fi
          if ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            echo "aarch64-linux-gnu-gcc не найден"
            exit 1
          fi
          zig version
          aarch64-linux-gnu-gcc --version | head -n 1
          cat > /tmp/aarch64-musl-toolchain <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail

          normalize_features() {
            local rest="$1" f out="" last
            while :; do
              f=${rest%%+*}
              if [ "$rest" = "$f" ]; then last=1; else last=0; fi
              case "$f" in
                fp16) f=fullfp16 ;;
              esac
              if [ -n "$out" ]; then out="$out+$f"; else out="$f"; fi
              if [ "$last" -eq 1 ]; then break; fi
              rest=${rest#*+}
            done
            printf '%s' "$out"
          }

          args=("-target" "aarch64-linux-musl")
          for arg in "$@"; do
            case "$arg" in
              -march=armv8*|-march=armv9*)
                arch=${arg#-march=}
                feats=""
                case "$arch" in
                  *+*) feats=$(normalize_features "${arch#*+}") ;;
                esac
                if [ -n "$feats" ]; then
                  args+=("-mcpu=generic+$feats")
                else
                  args+=("-mcpu=generic")
                fi
                ;;
              *) args+=("$arg") ;;
            esac
          done

          case "$(basename "$0")" in
            *cxx) exec zig c++ "${args[@]}" ;;
            *) exec zig cc "${args[@]}" ;;
          esac
          WRAPPER
          chmod +x /tmp/aarch64-musl-toolchain
          ln -sf /tmp/aarch64-musl-toolchain /tmp/aarch64-musl-cc
          ln -sf /tmp/aarch64-musl-toolchain /tmp/aarch64-musl-cxx
          echo "TOOLCHAIN READY"

      - name: qwentts.cpp source (с ggml-сабмодулем)
        env:
          QWEN_REF: ${{ github.event.inputs.qwen_ref || '2edb35f87b709a070b2d5379f77e5c52a1daa585' }}
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/ServeurpersoCom/qwentts.cpp.git /tmp/qwentts
          cd /tmp/qwentts
          git checkout "$QWEN_REF"
          git submodule update --init --recursive
          QWEN_HEAD=$(git rev-parse HEAD)
          GGML_HEAD=$(git -C ggml rev-parse HEAD)
          echo "QWEN_HEAD=$QWEN_HEAD" >> "$GITHUB_ENV"
          echo "GGML_HEAD=$GGML_HEAD" >> "$GITHUB_ENV"
          echo "qwentts: $QWEN_HEAD"
          echo "ggml: $GGML_HEAD"
          if [ "$GGML_HEAD" != "ef4555b7aede4467a5de803b103615e0a5f30dd8" ]; then
            echo "ggml pin differs from G2/G4: $GGML_HEAD" >&2
            exit 1
          fi

      - name: Одна переменная — G8 async codec overlap; база — G4 codec8
        env:
          VARIANT: ${{ steps.params.outputs.variant }}
        run: |
          set -euo pipefail
          cd /tmp/qwentts
          python3 - <<'PY'
          import os, sys
          from pathlib import Path

          root = Path(sys.argv[1]) if len(sys.argv) > 1 else Path("/tmp/qwentts")
          variant = os.environ.get("VARIANT", "overlap")
          assert variant in ("baseline", "overlap")

          # ---------------------------------------------------------------- G4 codec8 (общая база)
          p = root / "src/pipeline-codec.cpp"
          t = p.read_text()
          old_load = "    pc->bp              = bp;\n"
          new_load = (
              "    // G4 codec8: отдельный CPU-бэкенд кодера, 8 потоков; Talker/Predictor остаются на 4.\n"
              "    BackendPair codec_bp = {};\n"
              "    codec_bp.backend = cpu_backend_new(backend_cpu_n_threads() * 2);\n"
              "    codec_bp.cpu_backend = codec_bp.backend;\n"
              "    if (!codec_bp.backend) {\n"
              '        qt_log(QT_LOG_ERROR, "[Load] Codec backend init failed");\n'
              "        return false;\n"
              "    }\n"
              "    bp = codec_bp;\n"
              "    pc->bp              = bp;\n"
              '    qt_log(QT_LOG_INFO, "[Load] Codec backend: %s (CPU threads: %d)",\n'
              "           ggml_backend_name(bp.backend), backend_cpu_n_threads() * 2);\n"
          )
          assert t.count(old_load) == 1, f"old_load count {t.count(old_load)}"
          t = t.replace(old_load, new_load)
          old_free = "    if (pc->gguf.gguf) {\n        gf_close(&pc->gguf);\n    }\n}\n"
          new_free = (
              "    if (pc->gguf.gguf) {\n        gf_close(&pc->gguf);\n    }\n"
              "    backend_release(pc->bp.backend, pc->bp.cpu_backend);\n"
              "    pc->bp = {};\n"
              "}\n"
          )
          assert t.count(old_free) == 1, f"old_free count {t.count(old_free)}"
          p.write_text(t.replace(old_free, new_free))

          if variant == "baseline":
              print("G8 baseline: G4 codec8 only")
              sys.exit(0)

          # ---------------------------------------------------------------- G8 async codec overlap
          p = root / "src/pipeline-tts.cpp"
          t = p.read_text()


          def sub(old, new, tag):
              global t
              n = t.count(old)
              assert n == 1, f"{tag}: anchor count {n}"
              t = t.replace(old, new)


          sub(
              "#include <cstdio>\n#include <cstdlib>\n#include <cstring>\n",
              "#include <cstdio>\n#include <cstdlib>\n#include <cstring>\n"
              "#include <atomic>\n#include <condition_variable>\n#include <deque>\n#include <memory>\n"
              "#include <mutex>\n#include <thread>\n",
              "includes",
          )

          sub(
              "// Single threaded: every entry runs on the thread that owns the GPU.\n",
              "// G8 async codec overlap: Talker/predictor run on the GPU-owning thread;\n"
              "// the codec flush runs on one dedicated worker.\n",
              "comment",
          )

          chunk_struct = r"""// G8 async codec overlap: chunk snapshot. The worker never touches
          // TtsSlot/TtsJob - only copied codes, serial, callback and user_data.
          struct TtsCodecChunk {
              int                            n, M, K;
              std::vector<int32_t>           codes;      // [n][M][K]
              std::vector<uint8_t>           live;       // [M]
              std::vector<int64_t>           serial;     // [M] or -1
              std::vector<qt_audio_chunk_cb> fn;         // [M] NULL = no delivery
              std::vector<void *>            ud;         // [M]
              std::atomic<uint32_t>          cancelled{ 0 };
              double                         ms     = 0.0;
              bool                           failed = false;
              std::string                    err;
          };

          """
          # TtsEngine: add worker state at the end of the struct
          old_engine_tail = (
              "    std::vector<float *> codec_outs;       // per lane out or NULL\n"
              "};\n\n"
              "TtsEngine * tts_engine_new(PipelineTTS * pt, BPETokenizer * tok) {\n"
          )
          new_engine_tail = (
              "    std::vector<float *> codec_outs;       // per lane out or NULL\n\n"
              "    // G8: one worker owns pt->codec and chunk buffers between drains.\n"
              "    std::thread                                 codec_th;\n"
              "    std::mutex                                  codec_mu;\n"
              "    std::condition_variable                     codec_cv, codec_idle_cv;\n"
              "    std::deque<std::unique_ptr<TtsCodecChunk>>  codec_q, codec_done;\n"
              "    int                                         codec_inflight = 0;\n"
              "    bool                                        codec_stop = false, codec_dead = false;\n"
              "};\n\n"
          )
          sub("struct TtsEngine {\n", chunk_struct + "struct TtsEngine {\n", "chunk struct")
          sub(old_engine_tail, new_engine_tail, "engine struct")

          worker_code = r"""
          // G8: тело старого flush, работающее со снимком задачи. Никаких qt_set_error —
          // g_last_error thread_local; ошибка возвращается в main через j->failed/j->err.
          static void tts_codec_run(TtsEngine * e, TtsCodecChunk * j) {
              PipelineTTS * pt = e->pt;
              const int K = j->K, M = j->M, hop = TOKENIZER_HOP_LENGTH;
              Timer t_codec;
              int off = 0, left = j->n;
              while (left > 0) {
                  int T = 1 << (CODEC_STREAM_CLASSES - 1);
                  while (T > left) {
                      T >>= 1;
                  }
                  for (int m = 0; m < M; m++) {
                      for (int k = 0; k < K; k++) {
                          for (int t = 0; t < T; t++) {
                              e->codec_codes[(size_t) (m * K + k) * (size_t) T + (size_t) t] =
                                  j->codes[((size_t) (off + t) * (size_t) M + (size_t) m) * (size_t) K + (size_t) k];
                          }
                      }
                  }
                  for (int m = 0; m < M; m++) {
                      const bool want = j->live[m] != 0 && j->fn[m] != nullptr;
                      e->codec_outs[(size_t) m] = want
                          ? e->codec_audio.data() + (size_t) m * (size_t) (1 << (CODEC_STREAM_CLASSES - 1)) * (size_t) hop
                          : nullptr;
                  }
                  if (!pipeline_codec_decode_stream_batch(&pt->codec, e->codec_codes.data(), T, M, e->codec_outs.data())) {
                      j->failed = true;
                      j->err    = "pipeline_codec_decode_stream_batch failed";
                      break;
                  }
                  off += T;
                  left -= T;
                  for (int m = 0; m < M; m++) {
                      if (!e->codec_outs[(size_t) m]) {
                          continue;
                      }
                      if (!j->fn[(size_t) m](e->codec_outs[(size_t) m], T * hop, j->ud[(size_t) m])) {
                          j->cancelled.fetch_or(1u << m, std::memory_order_relaxed);
                          qt_log(QT_LOG_INFO, "[Pipeline] G8 on_chunk aborted (lane %d)", m);
                      }
                  }
              }
              j->ms = t_codec.ms();
          }

          static void tts_codec_worker(TtsEngine * e) {
              for (;;) {
                  std::unique_ptr<TtsCodecChunk> j;
                  {
                      std::unique_lock<std::mutex> lk(e->codec_mu);
                      e->codec_cv.wait(lk, [&] { return e->codec_stop || !e->codec_q.empty(); });
                      if (e->codec_q.empty()) {
                          return;
                      }
                      j = std::move(e->codec_q.front());
                      e->codec_q.pop_front();
                  }
                  try {
                      tts_codec_run(e, j.get());
                  } catch (const std::exception & ex) {
                      j->failed = true;
                      j->err    = ex.what();
                  } catch (...) {
                      j->failed = true;
                      j->err    = "codec worker exception";
                  }
                  {
                      std::lock_guard<std::mutex> lk(e->codec_mu);
                      e->codec_done.push_back(std::move(j));
                      e->codec_inflight--;
                  }
                  e->codec_idle_cv.notify_all();
              }
          }

          // Только основной поток: забирает завершённые задачи, списывает codec_ms
          // и отложенный отказ on_chunk на живые слоты по стабильному serial.
          static bool tts_codec_harvest(TtsEngine * e) {
              bool ok = !e->codec_dead;
              for (;;) {
                  std::unique_ptr<TtsCodecChunk> j;
                  {
                      std::lock_guard<std::mutex> lk(e->codec_mu);
                      if (e->codec_done.empty()) {
                          break;
                      }
                      j = std::move(e->codec_done.front());
                      e->codec_done.pop_front();
                  }
                  if (j->failed) {
                      ok = false;
                      qt_set_error("G8 codec: %s", j->err.c_str());
                  }
                  for (int m = 0; m < j->M; m++) {
                      if (j->serial[(size_t) m] < 0) {
                          continue;
                      }
                      TtsSlot * s = NULL;
                      for (TtsSlot & o : e->slots) {
                          if (o.serial == j->serial[(size_t) m]) {
                              s = &o;
                              break;
                          }
                      }
                      if (!s) {
                          continue;
                      }
                      s->perf.codec_ms += j->ms;
                      if (j->cancelled.load(std::memory_order_relaxed) & (1u << m)) {
                          s->finished   = true;
                          s->fin_status = QT_STATUS_CANCELLED;
                      }
                  }
              }
              return ok;
          }

          static bool tts_codec_drain(TtsEngine * e) {
              {
                  std::unique_lock<std::mutex> lk(e->codec_mu);
                  e->codec_idle_cv.wait(lk, [&] { return e->codec_inflight == 0; });
              }
              return tts_codec_harvest(e);
          }

          // Snapshot + hand-off: владение строками переходит задаче, основной поток
          // сразу возвращается к AR. Предел очереди 2 — единственная точка backpressure.
          static bool tts_codec_enqueue(TtsEngine * e) {
              PipelineTTS * pt = e->pt;
              const int K = pt->num_code_groups, M = e->codec_M;
              while (e->codec_pending_n > 0) {
                  int T = 1 << (CODEC_STREAM_CLASSES - 1);
                  while (T > e->codec_pending_n) {
                      T >>= 1;
                  }
                  {
                      std::unique_lock<std::mutex> lk(e->codec_mu);
                      e->codec_idle_cv.wait(lk, [&] { return e->codec_inflight < 2; });
                  }
                  std::unique_ptr<TtsCodecChunk> j(new TtsCodecChunk());
                  j->n = T; j->M = M; j->K = K;
                  j->codes.assign((size_t) T * (size_t) M * (size_t) K, 0);
                  j->live.assign((size_t) M, 0);
                  j->serial.assign((size_t) M, -1);
                  j->fn.assign((size_t) M, nullptr);
                  j->ud.assign((size_t) M, nullptr);
                  for (int m = 0; m < M; m++) {
                      TtsSlot * s = tts_engine_codec_lane_slot(e, m);
                      if (!s) {
                          continue;
                      }
                      j->serial[(size_t) m] = s->serial;
                      const bool want = e->codec_live[(size_t) m] && s->fin_status != QT_STATUS_CANCELLED &&
                                        s->job->params->on_chunk != NULL;
                      if (want) {
                          j->live[(size_t) m] = 1;
                          j->fn[(size_t) m]   = s->job->params->on_chunk;
                          j->ud[(size_t) m]   = s->job->params->on_chunk_user_data;
                      }
                  }
                  for (int t = 0; t < T; t++) {
                      for (int m = 0; m < M; m++) {
                          for (int k = 0; k < K; k++) {
                              j->codes[((size_t) t * (size_t) M + (size_t) m) * (size_t) K + (size_t) k] =
                                  e->codec_pending[((size_t) t * (size_t) M + (size_t) m) * (size_t) K + (size_t) k];
                          }
                      }
                  }
                  e->codec_pending_n -= T;
                  if (e->codec_pending_n > 0) {
                      std::memmove(e->codec_pending.data(), e->codec_pending.data() + (size_t) T * (size_t) M * (size_t) K,
                                   (size_t) e->codec_pending_n * (size_t) M * (size_t) K * sizeof(int32_t));
                  }
                  if (e->codec_dead || pt->codec.backend == pt->backend) {
                      // G4 не применён — честно работаем синхронно, без выигрыша от перекрытия.
                      tts_codec_run(e, j.get());
                      std::lock_guard<std::mutex> lk(e->codec_mu);
                      e->codec_done.push_back(std::move(j));
                      continue;
                  }
                  {
                      std::lock_guard<std::mutex> lk(e->codec_mu);
                      e->codec_inflight++;
                      e->codec_q.push_back(std::move(j));
                  }
                  e->codec_cv.notify_one();
              }
              return true;
          }
          """
          # Вставляем воркер сразу после TtsEngine, до tts_engine_new / tts_engine_free.
          sub(
              "    bool                                        codec_stop = false, codec_dead = false;\n};\n\n",
              "    bool                                        codec_stop = false, codec_dead = false;\n};\n\n"
              "static TtsSlot * tts_engine_codec_lane_slot(TtsEngine * e, int m);\n"
              + worker_code
              + "TtsEngine * tts_engine_new(PipelineTTS * pt, BPETokenizer * tok) {\n",
              "worker insert",
          )

          sub(
              "    e->slots.reserve(maxM);\n    return e;\n",
              "    e->slots.reserve(maxM);\n"
              "    // G8: один воркер на движок; при отказе создания работаем синхронно.\n"
              "    try {\n"
              "        e->codec_th = std::thread(tts_codec_worker, e);\n"
              "    } catch (...) {\n"
              "        e->codec_dead = true;\n"
              "    }\n"
              "    return e;\n",
              "new engine",
          )

          sub(
              "void tts_engine_free(TtsEngine * e) {\n    delete e;\n}\n",
              "void tts_engine_free(TtsEngine * e) {\n"
              "    tts_codec_drain(e);\n"
              "    {\n"
              "        std::lock_guard<std::mutex> lk(e->codec_mu);\n"
              "        e->codec_stop = true;\n"
              "    }\n"
              "    e->codec_cv.notify_all();\n"
              "    if (e->codec_th.joinable()) {\n"
              "        e->codec_th.join();\n"
              "    }\n"
              "    delete e;\n"
              "}\n",
              "free engine",
          )

          sub(
              "    if (e->codec_pending_n > 0 && !tts_engine_codec_flush(e)) {\n        return false;\n    }\n",
              "    if (!tts_codec_enqueue(e) || !tts_codec_drain(e)) {\n        return false;\n    }\n",
              "admit flush",
          )

          sub(
              "bool tts_engine_admit(TtsEngine * e, TtsJob * job) {\n    PipelineTTS *                pt     = e->pt;\n",
              "bool tts_engine_admit(TtsEngine * e, TtsJob * job) {\n"
              "    // pipeline_codec_encode uses pt->codec before the lane attach: drain first.\n"
              "    if (!tts_codec_drain(e)) {\n"
              '        qt_set_error("tts_engine_admit: G8 codec drain failed");\n'
              "        return tts_admit_fail(job, QT_STATUS_GENERATE_FAILED);\n"
              "    }\n"
              "    PipelineTTS *                pt     = e->pt;\n",
              "admit head",
          )

          sub(
              "    // 2) Cancel poll and per slot c0 sampling: suppression, repetition\n",
              "    const bool codec_ok = tts_codec_harvest(e);\n\n"
              "    // 2) Cancel poll and per slot c0 sampling: suppression, repetition\n",
              "harvest",
          )

          old_stage5 = """    if (e->codec_M > 0) {
                  const int num_cg     = pt->num_code_groups;
                  bool      any_finish = false;
                  bool      any_stage  = false;
                  for (TtsSlot & s : e->slots) {
                      if (s.codec_set < 0) {
                          continue;
                      }
                      any_finish = any_finish || s.finished;
                      any_stage  = any_stage || s.has_frame;
                  }
                  bool ok = true;
                  if (any_finish && e->codec_pending_n > 0) {
                      ok = tts_engine_codec_flush(e);
                  }
                  if (ok && any_stage) {
                      int32_t * row =
                          e->codec_pending.data() + (size_t) e->codec_pending_n * (size_t) e->codec_M * (size_t) num_cg;
                      for (int m = 0; m < e->codec_M; m++) {
                          TtsSlot * s = tts_engine_codec_lane_slot(e, m);
                          if (s && s->has_frame) {
                              std::memcpy(row + (size_t) m * (size_t) num_cg, s->all_codes.back().data(),
                                          (size_t) num_cg * sizeof(int32_t));
                              e->codec_live[(size_t) m] = 1;
                          } else {
                              std::memset(row + (size_t) m * (size_t) num_cg, 0, (size_t) num_cg * sizeof(int32_t));
                              e->codec_live[(size_t) m] = 0;
                          }
                      }
                      e->codec_pending_n++;
                      if (any_finish) {
                          ok = tts_engine_codec_flush(e);
                      } else if (e->codec_pending_n >= e->codec_target) {
                          ok = tts_engine_codec_flush(e);
                          if (ok && e->codec_target < (1 << (CODEC_STREAM_CLASSES - 1))) {
                              e->codec_target <<= 1;
                          }
                      }
                  }
                  if (!ok) {
                      qt_set_error("tts_engine_step: streaming codec decode failed");
                      qt_log(QT_LOG_ERROR, "[Pipeline] streaming codec decode failed");
                      for (TtsSlot & s : e->slots) {
                          if (s.codec_set >= 0) {
                              s.finished   = true;
                              s.fin_status = QT_STATUS_GENERATE_FAILED;
                          }
                      }
                  }
              }
          """
          new_stage5 = """    if (e->codec_M > 0) {
                  const int num_cg      = pt->num_code_groups;
                  bool      ok         = codec_ok;
                  bool      any_finish = false;
                  bool      any_stage  = false;
                  for (TtsSlot & s : e->slots) {
                      // G8: finished non-streaming slots also force a drain before retirement.
                      any_finish = any_finish || s.finished;
                      any_stage  = any_stage || (s.codec_set >= 0 && s.has_frame);
                  }
                  if (any_stage) {
                      int32_t * row =
                          e->codec_pending.data() + (size_t) e->codec_pending_n * (size_t) e->codec_M * (size_t) num_cg;
                      for (int m = 0; m < e->codec_M; m++) {
                          TtsSlot * s = tts_engine_codec_lane_slot(e, m);
                          if (s && s->has_frame) {
                              std::memcpy(row + (size_t) m * (size_t) num_cg, s->all_codes.back().data(),
                                          (size_t) num_cg * sizeof(int32_t));
                              e->codec_live[(size_t) m] = 1;
                          } else {
                              std::memset(row + (size_t) m * (size_t) num_cg, 0, (size_t) num_cg * sizeof(int32_t));
                              e->codec_live[(size_t) m] = 0;
                          }
                      }
                      e->codec_pending_n++;
                  }
                  if (any_finish) {
                      if (!tts_codec_enqueue(e)) {
                          ok = false;
                      }
                  } else if (any_stage && e->codec_pending_n >= e->codec_target) {
                      if (!tts_codec_enqueue(e)) {
                          ok = false;
                      } else if (e->codec_target < (1 << (CODEC_STREAM_CLASSES - 1))) {
                          e->codec_target <<= 1;
                      }
                  }
                  // G8: последний дренаж перед retirement гарантирует, что ни одна
                  // очередь не ссылается на уходящий слот.
                  if (any_finish && !tts_codec_drain(e)) {
                      ok = false;
                  }
                  if (!ok) {
                      qt_set_error("tts_engine_step: G8 streaming codec decode failed");
                      qt_log(QT_LOG_ERROR, "[Pipeline] G8 streaming codec decode failed");
                      for (TtsSlot & s : e->slots) {
                          if (s.codec_set >= 0) {
                              s.finished   = true;
                              s.fin_status = QT_STATUS_GENERATE_FAILED;
                          }
                      }
                  }
              }
          """
          sub(old_stage5, new_stage5, "stage5")

          p.write_text(t)
          print("G8 overlap: pipeline-tts.cpp patched")
          PY
          grep -Fq 'G4 codec8' src/pipeline-codec.cpp \
            || { echo "G8: маркер G4 codec8 не найден" >&2; exit 1; }
          if [ "$VARIANT" = "baseline" ]; then
            test "$(git diff --name-only -- src/)" = "src/pipeline-codec.cpp" \
              || { echo "baseline: изменено больше одного файла" >&2; exit 1; }
          else
            grep -Fq 'G8 async codec overlap' src/pipeline-tts.cpp \
              || { echo "G8: overlap-маркер не найден" >&2; exit 1; }
            files=$(git diff --name-only -- src/ | tr '\n' ' ' | sed 's/ $//')
            test "$files" = "src/pipeline-codec.cpp src/pipeline-tts.cpp" \
              || { echo "overlap: изменено больше двух файлов: $files" >&2; exit 1; }
          fi
          test -z "$(git -C ggml status --porcelain)" \
            || { echo "ggml не должен быть изменён" >&2; exit 1; }
          git --no-pager diff -- src/

      - name: CMake musl aarch64 (флаги байт-в-байт как в G4/G6)
        env:
          VARIANT: ${{ steps.params.outputs.variant }}
        run: |
          set -euo pipefail
          cd /tmp/qwentts
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/tmp/aarch64-musl-cc \
            -DCMAKE_CXX_COMPILER=/tmp/aarch64-musl-cxx \
            -DCMAKE_ASM_COMPILER=/usr/bin/aarch64-linux-gnu-gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_BUILD_RPATH='$ORIGIN' \
            -DGGML_NATIVE=OFF \
            -DGGML_STATIC=ON \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_KLEIDIAI=OFF \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DQWEN_SHARED=ON 2>&1 | tee "/tmp/qwentts-cmake-$VARIANT.log"
          cmake --build build -j4 --target qwen-tts qwen-codec tts-server qwen

      - name: Проверка артефактов и manifest
        env:
          VARIANT: ${{ steps.params.outputs.variant }}
        run: |
          set -euo pipefail
          cd /tmp/qwentts/build
          file qwen-tts qwen-codec tts-server libqwen.so
          readelf -Ws libqwen.so > /tmp/libqwen-symbols.txt
          grep -q 'qt_init' /tmp/libqwen-symbols.txt || { echo "нет qt_init"; exit 1; }
          grep -q 'qt_synthesize' /tmp/libqwen-symbols.txt || { echo "нет qt_synthesize"; exit 1; }
          for f in qwen-tts qwen-codec tts-server libqwen.so; do
            readelf -d "$f" | grep -E 'NEEDED|RUNPATH' || true
          done
          BIN_SHA=$(sha256sum qwen-tts qwen-codec tts-server libqwen.so)
          QWEN_SHA=$(sha256sum qwen-tts | cut -d' ' -f1)
          CPU_LIB=$(find . -maxdepth 3 -name 'libggml-cpu.so.1.0.0' | head -n 1)
          [ -n "$CPU_LIB" ] || { echo "нет libggml-cpu.so.1.0.0" >&2; exit 1; }
          CPU_SHA=$(sha256sum "$CPU_LIB" | cut -d' ' -f1)
          LIB_SHA=$(sha256sum libqwen.so | cut -d' ' -f1)
          case "$VARIANT:$QWEN_SHA" in
            baseline:595035cd49902412b1085f5a6cdeec5aa5cdf7ef7ae49f498fb3fa3d3921e202)
              echo "baseline: qwen-tts байт-идентичен G4" ;;
            baseline:*)
              echo "baseline: qwen-tts $QWEN_SHA != G4 595035cd..." >&2; exit 1 ;;
            overlap:595035cd49902412b1085f5a6cdeec5aa5cdf7ef7ae49f498fb3fa3d3921e202)
              echo "overlap: qwen-tts не изменился, патч не попал в сборку" >&2; exit 1 ;;
            overlap:*)
              echo "overlap: qwen-tts отличается от G4: $QWEN_SHA" ;;
          esac
          case "$CPU_SHA" in
            b0bc63b93b2d789aaefdf0893b534044563561e40e8c8db856c91a60434a711f)
              echo "libggml-cpu байт-идентичен G4 (ggml не менялся)" ;;
            *) echo "libggml-cpu $CPU_SHA != G4 b0bc63b9..." >&2; exit 1 ;;
          esac
          case "$VARIANT" in
            baseline)
              case "$LIB_SHA" in
                cf76c0ae49fe31a4989ccb3c4b3defd661c34429f053d7ecc8b01b3a49a9fe54)
                  echo "baseline: libqwen байт-идентичен G4" ;;
                *) echo "baseline libqwen $LIB_SHA != G4 cf76c0ae..." >&2; exit 1 ;;
              esac
              ;;
            overlap)
              case "$LIB_SHA" in
                cf76c0ae49fe31a4989ccb3c4b3defd661c34429f053d7ecc8b01b3a49a9fe54)
                  echo "overlap: libqwen не изменился, патч не попал в сборку" >&2; exit 1 ;;
                *) echo "overlap: libqwen отличается от G4: $LIB_SHA" ;;
              esac
              ;;
          esac
          GGML_LIBS=$(find . -maxdepth 3 -name 'libggml*.so*' | sed 's|^\./||' | sort -u)
          tar czf "/tmp/qwentts-arm-$VARIANT.tar.gz" \
            qwen-tts qwen-codec tts-server libqwen.so $GGML_LIBS
          SHA=$(sha256sum "/tmp/qwentts-arm-$VARIANT.tar.gz" | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" "/tmp/qwentts-arm-$VARIANT.tar.gz" > "/tmp/qwentts-arm-$VARIANT.sha256"
          echo "$BIN_SHA" > "/tmp/qwentts-arm-$VARIANT.binaries.sha256"
          jq -n \
            --arg variant "$VARIANT" \
            --arg qwen_ref "$QWEN_HEAD" \
            --arg ggml_ref "$GGML_HEAD" \
            --arg patch "$(case "$VARIANT" in overlap) echo 'G8 async codec overlap in pipeline-tts.cpp' ;; *) echo 'G4 codec8 only' ;; esac)" \
            --arg kleidiai OFF \
            --arg qwen_tts_sha256 "$QWEN_SHA" \
            --arg libggml_cpu_sha256 "$CPU_SHA" \
            --arg libqwen_sha256 "$LIB_SHA" \
            --arg tar_sha256 "$SHA" \
            --arg binaries_sha256 "$BIN_SHA" \
            '{
              variant: $variant,
              qwen_ref: $qwen_ref,
              ggml_ref: $ggml_ref,
              patch: $patch,
              ggml_cpu_arch: null,
              ggml_cpu_kleidiai: $kleidiai,
              qwen_tts_sha256: $qwen_tts_sha256,
              libggml_cpu_sha256: $libggml_cpu_sha256,
              libqwen_sha256: $libqwen_sha256,
              tar_sha256: $tar_sha256,
              binaries_sha256: $binaries_sha256,
              scope: "research-only; APK/CI-release not touched"
            }' > "/tmp/qwentts-arm-$VARIANT.manifest.json"
          cat "/tmp/qwentts-arm-$VARIANT.manifest.json"

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwentts-arm-${{ steps.params.outputs.variant }}
          path: |
            /tmp/qwentts-arm-*.tar.gz
            /tmp/qwentts-arm-*.sha256
            /tmp/qwentts-arm-*.manifest.json
          if-no-files-found: error
