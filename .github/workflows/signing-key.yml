name: Signing key (one-off)

# Одноразовая генерация постоянного ключа подписи.
#
# Зачем: ключ, которым был подписан установленный APK, делался на PC в
# ~/.android/debug.keystore и потерян. Без него обновление поверх невозможно:
# Android сравнивает сертификат нового APK с установленным и при расхождении
# отказывает (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Ключ раннера не годится —
# он генерируется заново на каждом прогоне, то есть каждый релиз подписан
# по-своему.
#
# Этот workflow делает ключ ОДИН раз. Дальше его берёт release-apk.yml из
# signing/debug.keystore (файл коммитится в репозиторий) либо из секрета
# ANDROID_DEBUG_KEYSTORE_BASE64, если он задан.
#
# Параметры стандартные для debug-сборки AGP: alias androiddebugkey,
# пароль хранилища и ключа — android. Поэтому ни build.gradle.kts, ни
# команда сборки не меняются: ключ просто кладётся в $HOME/.android/.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    name: Сгенерировать debug.keystore
    runs-on: ubuntu-latest
    steps:
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ключ (JKS, 30 лет, alias androiddebugkey)
        run: |
          set -eu
          keytool -genkeypair -v \
            -keystore debug.keystore -storetype JKS \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "--- отпечаток сертификата:"
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias name|SHA256:|Valid from"
          echo "--- sha256 файла ключа:"
          sha256sum debug.keystore
          echo "--- base64 (для секрета ANDROID_DEBUG_KEYSTORE_BASE64):"
          base64 -w0 debug.keystore > debug.keystore.b64
          wc -c < debug.keystore.b64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: |
            debug.keystore
            debug.keystore.b64
          retention-days: 90
