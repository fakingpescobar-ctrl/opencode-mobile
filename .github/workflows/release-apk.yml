name: Release APK

# Зачем этот workflow
# ------------------
# Раньше единственная «полная» сборка жила на машине разработчика (build-release.ps1):
# jniLibs (301 МБ) в git не лежат, а ubuntu-джоба CI собирала APK БЕЗ ядра
# opencode — такая сборка ставится, стартует и не умеет запускать сервер.
# Здесь нативы подтягиваются по пинам (tools/natives.json) прямо из публичных
# источников (npm / Alpine / sherpa-onnx), сверяются по размеру и sha256 и
# попадают в APK. Значит GitHub собирает настоящий APK, а не пустышку.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Что в сборке (пойдёт в заметки релиза)"
        required: false
        default: ""
  push:
    tags: [ "apk-*" ]

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Собрать APK с ядром
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Отпечаток ключа, которым подписан APK, стоящий на телефоне. Пустое
      # значение = эталон неизвестен, и релиз помечается «installable=unknown».
      # Теперь он известен: 16.11 на телефон встал apk-11, подписанный
      # signing/debug.keystore из репозитория. Это же значение печатается в
      # заметках релиза. Смысл не в цифре, а в том, что смена ключа (или тихий
      # откат на ключ раннера) превращается в installable=no и предупреждение,
      # а не в «сборка успешна, а поверх не встаёт».
      EXPECTED_CERT_SHA256: "196cdc94d19e0b248e9e897a4071579adf507a3e2cfef4d6c79e492762692abf"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .natives-cache
          key: "apk-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'tools/natives.json', 'gradle.properties') }}"
          restore-keys: |
            apk-${{ runner.os }}-

      - name: SDK platform 36 / build-tools
        run: |
          yes | sdkmanager "platforms;android-36" > /dev/null 2>&1 || true
          yes | sdkmanager "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Ядро и нативы по пинам
        run: |
          chmod +x tools/fetch-natives.sh
          tools/fetch-natives.sh
          ls -l app/src/main/jniLibs/arm64-v8a/
          echo "ядро: $(sed -n 's/^opencode\.binaryVersion=//p' gradle.properties)"

      - name: Ключ подписи
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -eu
          mkdir -p "$HOME/.android"
          # Порядок: секрет → репозиторий → ключ раннера. Ключ раннера — это
          # провал по смыслу: он генерируется заново на каждом прогоне, поэтому
          # каждый релиз оказывается подписан по-своему и не встаёт на прошлый.
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$HOME/.android/debug.keystore"
            src=secret
          elif [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore "$HOME/.android/debug.keystore"
            src=repo
          else
            src=ci-default
            echo "::warning::постоянного ключа нет ни в secrets, ни в signing/debug.keystore — подпись будет случайной"
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep -E "Alias name|SHA256:" | head -4
          ks_fp=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ': ' )
          echo "source=$src" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$ks_fp" >> "$GITHUB_OUTPUT"

      - name: versionCode/versionName из номера запуска
        run: |
          # 4 — текущий versionCode на телефоне; отсчёт от него, чтобы обновление
          # не оказалось «понижением версии» (Android такое не ставит).
          code=$(( 4 + ${GITHUB_RUN_NUMBER} ))
          sed -i -E "s/^([[:space:]]*)versionCode = [0-9]+/\1versionCode = ${code}/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*)versionName = \"[^\"]*\"/\1versionName = \"0.1.0-b${GITHUB_RUN_NUMBER}\"/" app/build.gradle.kts
          grep -nE "versionCode|versionName" app/build.gradle.kts | head -5
          echo "APK_VERSION_CODE=${code}" >> "$GITHUB_ENV"

      - name: Сборка APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PskipNativeBuild=true --no-daemon --console=plain

      - name: Проверка APK — ядро внутри
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK=$APK"
          ls -l "$APK"
          size=$(stat -c %s "$APK")
          for lib in libopencode.so libbun-musl.so libc_musl.so libldmusl.so libstdcxx.so; do
            if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib"; then
              echo "::error::в APK нет lib/arm64-v8a/$lib — это сборка без ядра, публиковать нельзя"
              exit 1
            fi
            echo "ok lib/arm64-v8a/$lib"
          done
          # Пустышка весит ~30 МБ, настоящая сборка — за 250 МБ.
          if [ "$size" -lt 220000000 ]; then
            echo "::error::APK подозрительно мал ($size б) — ядро не попало в упаковку"
            exit 1
          fi
          # Ассеты плагинов: в APK должен лежать ровно тот файл, что в репозитории,
          # иначе упаковка молча взяла старую копию из кэша и приложение затрёт
          # ею живой плагин. Это уже случалось 15.11 21:59 (moltbook.js откатился
          # с 334 297 до 286 096).
          #
          # Сверка идёт с исходником в репозитории, а не с зашитым числом: пока
          # размер был зашит, любая правка плагина валила релиз («342591 вместо
          # 334297»), и число приходилось обновлять вручную. Порядок, который
          # защищает от отката, тот же: сначала правка в репозиторий, потом
          # сборка, потом установка, потом `approve-plugin.sh`.
          for pair in "assets/mcp/moltbook.js app/src/main/assets/mcp/moltbook.js" \
                      "assets/mcp/memory.js app/src/main/assets/mcp/memory.js"; do
            set -- $pair
            got=$(unzip -p "$APK" "$1" | sha256sum | cut -d' ' -f1)
            want=$(sha256sum "$2" | cut -d' ' -f1)
            echo "ассет $1 sha256=${got:-нет} (ждали $want)"
            if [ "${got:-}" != "$want" ]; then
              echo "::error::ассет $1 в APK не совпадает с $2 — в APK уехала не та копия"
              exit 1
            fi
          done
          sha256sum "$APK" | tee apk.sha256

      - name: Отпечаток подписи
        id: cert
        env:
          KS_FP: ${{ steps.key.outputs.fingerprint }}
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          # keytool -printcert -jarfile читает только v1 (JAR) подпись, а AGP
          # подписывает v2/v3 — на выходе пусто, и проверка «подписан не тем
          # ключом» падала с пустым отпечатком (прогон #3, 16.11). apksigner
          # читает ту схему, которой реально подписан APK, и заодно проверяет её.
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$AS" verify --print-certs "$APK" | tee cert.txt
          # Формат зависит от версии build-tools: «Signer #1 certificate SHA-256
          # digest:» или «V2 Signer: certificate SHA-256 digest:». Берём любую.
          fp=$(grep -a 'SHA-256 digest:' cert.txt | head -1 | sed 's/.*SHA-256 digest: *//' | tr -d ' :')
          [ -n "$fp" ] || { echo "::error::apksigner не назвал отпечаток сертификата"; exit 1; }
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          # Сверка «APK подписан именно тем ключом, который мы храним». Без неё
          # подмена ключа (или тихий откат на ключ раннера) выглядит как успех.
          ks=${KS_FP:-}
          ks=$(echo "$ks" | tr -d ' :' | tr 'A-F' 'a-f')
          fp_lc=$(echo "$fp" | tr 'A-F' 'a-f')
          if [ -n "$ks" ] && [ "$fp_lc" != "$ks" ]; then
            echo "::error::APK подписан не тем ключом: APK $fp_lc, ключ $ks"
            exit 1
          fi
          echo "APK подписан ключом из signing/$([ -f signing/debug.keystore ] && echo repo || echo ci)"
          if [ -n "${EXPECTED_CERT_SHA256:-}" ] && [ "$fp_lc" != "$(echo "$EXPECTED_CERT_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')" ]; then
            echo "::warning::отпечаток не совпал с эталоном установленного приложения — поверх не встанет"
            echo "installable=no" >> "$GITHUB_OUTPUT"
          elif [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "installable=unknown" >> "$GITHUB_OUTPUT"
          else
            echo "installable=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Переименовать APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          name="opencode-mobile-${APK_VERSION_CODE}-$(echo "${GITHUB_SHA}" | cut -c1-7).apk"
          cp "$APK" "dist-$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.APK_VERSION_CODE }}
          path: dist-*.apk
          retention-days: 30

      - name: Релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY_SOURCE: ${{ steps.key.outputs.source }}
          CERT_FP: ${{ steps.cert.outputs.fingerprint }}
          INSTALLABLE: ${{ steps.cert.outputs.installable }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          set -eu
          tag="apk-${APK_VERSION_CODE}"
          core=$(sed -n 's/^opencode\.binaryVersion=//p' gradle.properties)
          {
            echo "Собрано GitHub Actions, запуск #${GITHUB_RUN_NUMBER}, коммит ${GITHUB_SHA}."
            echo
            echo "- versionCode: ${APK_VERSION_CODE}"
            echo "- ядро opencode: ${core}"
            echo "- ключ подписи: ${KEY_SOURCE}"
            echo "- отпечаток подписи: ${CERT_FP}"
            echo "- sha256 APK: $(cut -d' ' -f1 apk.sha256)"
            echo
            case "$INSTALLABLE" in
              yes) echo "Установка поверх текущей версии: данные сохраняются." ;;
              no)  echo "**ВНИМАНИЕ: подпись не совпала с эталоном — установить поверх не получится.**" ;;
              *)   if [ "$KEY_SOURCE" = "repo" ] || [ "$KEY_SOURCE" = "secret" ]; then
                     echo "Подпись: постоянный ключ проекта (\`signing/debug.keystore\`), отпечаток сверен — все следующие сборки встают друг на друга без переустановки."
                     echo
                     echo "**Первый раз всё равно нужен переустанов**: установленное приложение подписано потерянным ключом с PC. Порядок — \`RESTORE_AFTER_REINSTALL.md\` (бэкап уже снят в \`appdata-backup/\` + \`loop-backup/\`)."
                   else
                     echo "**Ключ подписи не задан** — APK подписан ключом раннера, установить поверх нельзя."
                   fi ;;
            esac
            if [ -n "${NOTE:-}" ]; then echo; echo "${NOTE}"; fi
          } > notes.md
          gh release create "$tag" "dist-${APK_NAME}" \
            --title "APK ${APK_VERSION_CODE} (ядро ${core})" \
            --notes-file notes.md
          echo "релиз: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"