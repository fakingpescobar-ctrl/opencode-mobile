# Research-only: собрать qwentts.cpp под musl aarch64 и проверить ARM-варианты.
# НЕ трогает release-apk.yml, APK, подпись и установку на устройство.
# Основа: docs/research/QWEN3_TTS_MOBILE_ARM_RESEARCH.md (шаг 0).
# Запрещено: GGML_CPU_ARM_ARCH / повтор G1d; FA уже есть в пине через 76ec9de.
name: Build qwentts ARM research (baseline/KleidiAI)

on:
  workflow_dispatch:
    inputs:
      qwen_ref:
        description: 'коммит/тег ServeurpersoCom/qwentts.cpp'
        required: false
        default: '2edb35f87b709a070b2d5379f77e5c52a1daa585'
      variant:
        description: 'baseline или kleidiai (только одна переменная за прогон)'
        required: false
        default: 'baseline'
        type: choice
        options:
          - baseline
          - kleidiai

permissions:
  contents: read

concurrency:
  group: qwentts-arm-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Проверить вариант и зафиксировать параметры
        id: params
        run: |
          set -euo pipefail
          VARIANT="${{ github.event.inputs.variant || 'baseline' }}"
          case "$VARIANT" in
            baseline|kleidiai) ;;
            *) echo "Неизвестный variant: $VARIANT" >&2; exit 1 ;;
          esac
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "research variant: $VARIANT"
          echo "GGML_CPU_ARM_ARCH: НЕ задаётся (G1d уже DROP)"

      - name: Zig toolchain (aarch64-linux-musl через zig cc)
        run: |
          set -euo pipefail
          if command -v zig >/dev/null 2>&1; then
            echo "zig уже есть: $(zig version)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq zig || true
          fi
          if ! command -v zig >/dev/null 2>&1; then
            ZIG=0.13.0
            curl -fsSL --max-time 120 -o /tmp/zig.tar.xz \
              "https://ziglang.org/download/${ZIG}/zig-linux-x86_64-${ZIG}.tar.xz"
            tar -xf /tmp/zig.tar.xz -C /tmp
            echo "/tmp/zig-linux-x86_64-${ZIG}" >> $GITHUB_PATH
          fi
          zig version
          # G1d урок: Zig 0.13 не понимает -march=armv8.x-a как имя CPU.
          # KleidiAI добавляет per-source -march=armv8.2-a+..., поэтому
          # переводим ARM -march в -mcpu=generic+features, как в research-G1d.
          cat > /tmp/aarch64-musl-cc <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          args=("-target" "aarch64-linux-musl")
          for arg in "$@"; do
            case "$arg" in
              -march=armv8*|-march=armv9*)
                arch=${arg#-march=}
                case "$arch" in
                  *+*) feats=${arch#*+} ;;
                  *) feats="" ;;
                esac
                if [ -n "$feats" ]; then
                  args+=("-mcpu=generic+$feats")
                else
                  args+=("-mcpu=generic")
                fi
                ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig cc "${args[@]}"
          WRAPPER
          cat > /tmp/aarch64-musl-cxx <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          args=("-target" "aarch64-linux-musl")
          for arg in "$@"; do
            case "$arg" in
              -march=armv8*|-march=armv9*)
                arch=${arg#-march=}
                case "$arch" in
                  *+*) feats=${arch#*+} ;;
                  *) feats="" ;;
                esac
                if [ -n "$feats" ]; then
                  args+=("-mcpu=generic+$feats")
                else
                  args+=("-mcpu=generic")
                fi
                ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig c++ "${args[@]}"
          WRAPPER
          chmod +x /tmp/aarch64-musl-cc /tmp/aarch64-musl-cxx

      - name: qwentts.cpp source (с ggml-сабмодулем)
        env:
          QWEN_REF: ${{ github.event.inputs.qwen_ref || '2edb35f87b709a070b2d5379f77e5c52a1daa585' }}
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/ServeurpersoCom/qwentts.cpp.git /tmp/qwentts
          cd /tmp/qwentts
          git checkout "$QWEN_REF"
          git submodule update --init --recursive
          QWEN_HEAD=$(git rev-parse HEAD)
          GGML_HEAD=$(git -C ggml rev-parse HEAD)
          echo "QWEN_HEAD=$QWEN_HEAD" >> "$GITHUB_ENV"
          echo "GGML_HEAD=$GGML_HEAD" >> "$GITHUB_ENV"
          echo "qwentts: $QWEN_HEAD"
          echo "ggml: $GGML_HEAD"

      - name: FA уже в базе (инфраструктурная проверка пина, не performance-гейт)
        run: |
          set -euo pipefail
          cd /tmp/qwentts
          git merge-base --is-ancestor \
            76ec9de648cd093db5ea904b8257644d7b3b8e63 HEAD \
            || { echo "FA-коммит 76ec9de не belongs to pin"; exit 1; }
          grep -q 'ggml_compute_forward_flash_attn_ext' ggml/src/ggml-cpu/ops.cpp \
            || { echo "CPU Flash Attention не найден в ggml"; exit 1; }
          echo "FA: commit 76ec9de в истории, ggml ops.cpp содержит flash_attn_ext"

      - name: CMake musl aarch64 (одна переменная variants)
        env:
          VARIANT: ${{ steps.params.outputs.variant }}
        run: |
          set -euo pipefail
          KLEIDIAI=OFF
          if [ "$VARIANT" = "kleidiai" ]; then KLEIDIAI=ON; fi
          cd /tmp/qwentts
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/tmp/aarch64-musl-cc \
            -DCMAKE_CXX_COMPILER=/tmp/aarch64-musl-cxx \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_BUILD_RPATH='$ORIGIN' \
            -DGGML_NATIVE=OFF \
            -DGGML_STATIC=ON \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_CPU=ON \
            -DGGML_CPU_KLEIDIAI=$KLEIDIAI \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DQWEN_SHARED=ON 2>&1 | tee "/tmp/qwentts-cmake-$VARIANT.log"
          echo "GGML_CPU_KLEIDIAI=$KLEIDIAI"
          if [ "$KLEIDIAI" = "ON" ]; then
            grep -q 'Using KleidiAI optimized kernels' "/tmp/qwentts-cmake-$VARIANT.log" \
              || { echo "KleidiAI заявлен ON, но CMake его не активировал"; exit 1; }
          fi
          cmake --build build -j4 --target qwen-tts qwen-codec tts-server qwen

      - name: Проверка артефактов и manifest
        env:
          VARIANT: ${{ steps.params.outputs.variant }}
        run: |
          set -euo pipefail
          cd /tmp/qwentts/build
          file qwen-tts qwen-codec tts-server libqwen.so
          # Не grep -q напрямую из readelf: при pipefail grep выйдет рано и даст SIGPIPE.
          readelf -Ws libqwen.so > /tmp/libqwen-symbols.txt
          grep -q 'qt_init' /tmp/libqwen-symbols.txt || { echo "нет qt_init"; exit 1; }
          grep -q 'qt_synthesize' /tmp/libqwen-symbols.txt || { echo "нет qt_synthesize"; exit 1; }
          echo '--- dynamic deps ---'
          for f in qwen-tts qwen-codec tts-server libqwen.so; do
            readelf -d "$f" | grep -E 'NEEDED|RUNPATH' || true
          done
          GGML_LIBS=$(find . -maxdepth 3 -name 'libggml*.so*' | sed 's|^\./||' | sort -u)
          tar czf "/tmp/qwentts-arm-$VARIANT.tar.gz" \
            qwen-tts qwen-codec tts-server libqwen.so $GGML_LIBS
          SHA=$(sha256sum "/tmp/qwentts-arm-$VARIANT.tar.gz" | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" "/tmp/qwentts-arm-$VARIANT.tar.gz" > "/tmp/qwentts-arm-$VARIANT.sha256"
          BIN_SHA=$(sha256sum qwen-tts qwen-codec tts-server libqwen.so)
          echo "$BIN_SHA" > "/tmp/qwentts-arm-$VARIANT.binaries.sha256"
          # Эталон G1c (префиксы из QWEN3_TTS_ISA_GATE.md). Сравнение мягкое:
          # полный sha зависит от тулчейна, поэтому расхождение = warning, не гейт.
          for pair in 'qwen-tts 2b456a06' 'libqwen.so e2d9dcba' 'tts-server 39ba9fdd'; do
            set -- $pair
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            if [ "${actual#"$2"}" = "$actual" ]; then
              echo "WARNING: $1 sha $actual != эталонный префикс $2 (тулчейн мог измениться)"
            else
              echo "baseline sha prefix OK: $1 = $2"
            fi
          done
          jq -n \
            --arg variant "$VARIANT" \
            --arg qwen_ref "$QWEN_HEAD" \
            --arg ggml_ref "$GGML_HEAD" \
            --arg kleidiai "$([ "$VARIANT" = "kleidiai" ] && echo ON || echo OFF)" \
            --arg tar_sha256 "$SHA" \
            --arg binaries_sha256 "$BIN_SHA" \
            --arg reference_prefixes 'qwen-tts=2b456a06, libqwen.so=e2d9dcba, tts-server=39ba9fdd (G1c; мягкая сверка)' \
            '{
              variant: $variant,
              qwen_ref: $qwen_ref,
              ggml_ref: $ggml_ref,
              ggml_cpu_arch: null,
              ggml_cpu_kleidiai: $kleidiai,
              flash_attn: "already in baseline via 76ec9de",
              tar_sha256: $tar_sha256,
              binaries_sha256: $binaries_sha256,
              reference_prefixes: $reference_prefixes,
              scope: "research-only; APK/CI-release не трогаются"
            }' > "/tmp/qwentts-arm-$VARIANT.manifest.json"
          cat "/tmp/qwentts-arm-$VARIANT.manifest.json"

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwentts-arm-${{ steps.params.outputs.variant }}
          path: |
            /tmp/qwentts-arm-*.tar.gz
            /tmp/qwentts-arm-*.sha256
            /tmp/qwentts-arm-*.manifest.json
          if-no-files-found: error
