# CI: конвертировать ModernBERT-модели Hindsight из safetensors в GGUF.
# Готовых GGUF у hs-rerank-1/hs-embed-1 нет, но llama.cpp b12554 умеет
# ModernBertModel и ModernBertForSequenceClassification через conversion/bert.py.
# На телефон приходят только GGUF-артефакты; AMD/original веса остаются в CI.
name: Convert Hindsight ModernBERT to GGUF

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'тег llama.cpp'
        required: false
        default: 'b12554'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: llama.cpp source
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.llama_ref || 'b12554' }} \
            https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

      - name: Conversion deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/llama.cpp/requirements/requirements-convert_hf_to_gguf.txt
          python -m pip install -q huggingface_hub
          # b12554 конвертер не понимает TokenizersBackend из transformers 5.x.
          python -m pip install -q 'transformers==4.46.3'

      - name: Download safetensors + tokenizers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import snapshot_download
          for repo in ["hindsight-ai/hs-rerank-1", "hindsight-ai/hs-embed-1"]:
              p = snapshot_download(
                  repo_id=repo,
                  local_dir="/tmp/models/" + repo.split("/")[-1],
                  ignore_patterns=["*.onnx", "assets/*", ".gitattributes"],
              )
              print(repo, "->", p)
              # llama.cpp b12554 does not know gelu_pytorch_tanh. ModernBert graph
              # already uses GELU_ERF internally, so drop the override and log it.
              cfg = Path(p) / "config.json"
              data = json.loads(cfg.read_text())
              if "classifier_activation" in data:
                  print("drop classifier_activation:", data.pop("classifier_activation"))
                  cfg.write_text(json.dumps(data, indent=2))
              # HF publishes the new generic TokenizersBackend class; the pinned
              # transformers used by llama.cpp b12554 expects a concrete class.
              tcfg = Path(p) / "tokenizer_config.json"
              tdata = json.loads(tcfg.read_text())
              if tdata.get("tokenizer_class") == "TokenizersBackend":
                  tdata["tokenizer_class"] = "BertTokenizerFast"
                  tcfg.write_text(json.dumps(tdata, indent=2))
              # BPE + metaspace prepend_scheme 'always' is rejected by llama.cpp
              # b12554. 'first' is the supported equivalent for a single prompt.
              tj = Path(p) / "tokenizer.json"
              jdata = json.loads(tj.read_text())
              def fix(o):
                  if isinstance(o, dict):
                      if o.get("prepend_scheme") == "always":
                          o["prepend_scheme"] = "first"
                      for v in o.values():
                          fix(v)
                  elif isinstance(o, list):
                      for v in o:
                          fix(v)
              fix(jdata)
              tj.write_text(json.dumps(jdata, ensure_ascii=False))
          PY

      - name: Convert to GGUF (f16)
        run: |
          cd /tmp/llama.cpp
          python convert_hf_to_gguf.py /tmp/models/hs-rerank-1 \
            --outfile /tmp/hs-rerank-1-f16.gguf --outtype f16
          python convert_hf_to_gguf.py /tmp/models/hs-embed-1 \
            --outfile /tmp/hs-embed-1-f16.gguf --outtype f16
          ls -la /tmp/hs-*-f16.gguf

      - name: Upload rerank GGUF
        uses: actions/upload-artifact@v4
        with:
          name: hs-rerank-1-gguf
          path: /tmp/hs-rerank-1-f16.gguf

      - name: Upload embed GGUF
        uses: actions/upload-artifact@v4
        with:
          name: hs-embed-1-gguf
          path: /tmp/hs-embed-1-f16.gguf
