org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Версия бинаря opencode, который пакуется в APK как lib/arm64-v8a/libopencode.so.
# Бинарь НЕ лежит в git (app/src/main/jniLibs в .gitignore, ~195 МБ), поэтому это
# свойство - единственный источник правды: его читает tools/fetch-opencode-binary.ps1
# (какой пакет качать), app/build.gradle.kts (BuildConfig.OPENCODE_VERSION для экрана
# «О программе») и build.ps1 (проверка, что в jniLibs лежит именно эта версия).
# Смена версии = смена строки здесь + прогон tools\fetch-opencode-binary.ps1.
opencode.binaryVersion=2.0.27
