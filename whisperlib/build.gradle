plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Пути ВНЕШНИХ зависимостей нативки — конфигурируются через -P-свойства
// (CI-17): дефолты — машина разработчика (Windows + whisper.cpp + VulkanSDK).
// -PwhisperCppDir=...  -PvulkanSdkDir=... ; сборка нативки целиком отключается
// флагом -PskipNativeBuild=true (CI: ubuntu не имеет ни whisper.cpp, ни VulkanSDK).
def whisperCppDir = project.findProperty('whisperCppDir') ?: 'C:/Projects/whisper.cpp'
def vulkanSdkDir = project.findProperty('vulkanSdkDir') ?: 'C:/VulkanSDK/1.4.357.0'
def skipNativeBuild = project.hasProperty('skipNativeBuild')

// ---- Пин внешнего whisper.cpp (PR3): fail-fast против неизвестного состояния ----
// Нативка собирается ТОЛЬКО против зафиксированного коммита (WHISPER_PIN).
// Молчаливая сборка против произвольного HEAD = невоспроизводимые артефакты.
if (!skipNativeBuild) {
    def pinFile = file('src/main/jni/whisper/WHISPER_PIN')
    if (!pinFile.exists()) {
        throw new GradleException(
            "WHISPER_PIN отсутствует: ${pinFile} — восстановите файл, он закрепляет ревизию whisper.cpp для нативной сборки")
    }
    def pinned = pinFile.text.trim()
    def actual = ''
    new ByteArrayOutputStream().withStream { buf ->
        try {
            exec {
                commandLine 'git', '-C', whisperCppDir, 'rev-parse', 'HEAD'
                standardOutput = buf
            }
        } catch (Exception e) {
            throw new GradleException(
                "Не могу прочитать HEAD whisper.cpp в '${whisperCppDir}' (нужен git-клон). Задайте -PwhisperCppDir=...", e)
        }
        actual = buf.toString().trim()
    }
    if (!pinned.equals(actual)) {
        throw new GradleException(
            "whisper.cpp не на пине: закреплён ${pinned}, HEAD в '${whisperCppDir}' = ${actual}. " +
            "Обновите клон: git -C ${whisperCppDir} fetch && git -C ${whisperCppDir} checkout ${pinned}. " +
            "Если нужна новая ревизия — обновите WHISPER_PIN и пересоберите нативные артефакты.")
    }
    println "whisper.cpp pin OK: ${pinned}"
}

android {
    namespace 'com.whispercpp'
    compileSdk 36

    defaultConfig {
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
        if (!skipNativeBuild) {
            externalNativeBuild {
                cmake {
                    // Нативку всегда собираем в Release (-O3): Debug (-O0) делает
                    // whisper в 20-50 раз медленнее — «привет» считается минутами.
                    //
                    // GGML_VULKAN=ON включает Vulkan-бэкенд (Adreno GPU). Должна
                    // быть установлена Vulkan SDK (LunarG) — ggml компилирует
                    // шейдеры через glslc из неё при конфигурации.
                    arguments "-DCMAKE_BUILD_TYPE=Release", "-DGGML_VULKAN=ON", "-DWHISPER_LIB_DIR=${whisperCppDir}",
                         // Пути Vulkan SDK (LunarG). Версия по умолчанию — 1.4.357.0.
                         // SPIRV-Headers нужен host-инструменту vulkan-shaders-gen
                         // (компиляция .comp/.glsl шейдеров в .spv через glslc).
                         "-DSPIRV-Headers_DIR=${vulkanSdkDir}/Lib/cmake/SPIRV-Headers",
                         "-DCMAKE_PREFIX_PATH=${vulkanSdkDir}/Lib",
                         // Vulkan-Hpp (vulkan/vulkan.hpp) есть только в VulkanSDK,
                         // НЕ в NDK (там только C-заголовки). Направляем find_package:
                         "-DVulkan_INCLUDE_DIR=${vulkanSdkDir}/Include",
                         // Свой host-toolchain для vulkan-shaders-gen — штатный шаблон
                         // ggml ломается на Windows (backslash в без-кавычек пути).
                         // Путь ОТНОСИТЕЛЬНЫЙ от модуля (projectDir), не абсолютный.
                         "-DGGML_VULKAN_SHADERS_GEN_TOOLCHAIN=${projectDir}/src/main/jni/host-toolchain.cmake"
                    // When set, builds whisper.android against the version located
                    // at GGML_HOME instead of the copy bundled with whisper.cpp.
                    if (
                        project.hasProperty('GGML_HOME') &&
                        project.findProperty('GGML_CLBLAST') == 'ON'
                    ) {
                        // Turning on CLBlast requires GGML_HOME
                        arguments "-DGGML_HOME=${project.property('GGML_HOME')}",
                             "-DGGML_CLBLAST=ON",
                             "-DOPENCL_LIB=${project.property('OPENCL_LIB')}",
                             "-DCLBLAST_HOME=${project.property('CLBLAST_HOME')}",
                             "-DOPENCL_ROOT=${project.property('OPENCL_ROOT')}",
                             "-DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH",
                             "-DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH"
                    } else if (project.hasProperty('GGML_HOME')) {
                        arguments "-DGGML_HOME=${project.property('GGML_HOME')}"
                    }

                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    ndkVersion "27.1.12297006"
    if (!skipNativeBuild) {
        externalNativeBuild {
            cmake {
                path = file("src/main/jni/whisper/CMakeLists.txt")
            }
        }
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
}